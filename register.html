<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — GlowGuide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
<style>
  .onboard-wrap{ max-width:460px; margin:0 auto; padding: 8vh 24px 10vh; }
  .onboard-head{ text-align:center; margin-bottom:34px; }
  .auth-switch{ text-align:center; margin-top:18px; font-size:.9rem; color:var(--ink-soft); }
  .auth-switch a{ color:var(--lavender-deep); font-weight:700; }
  .field-error{ color:var(--danger); font-size:.82rem; margin-top:6px; display:none; }
  .field-error.show{ display:block; }
</style>
</head>
<body>

<div class="onboard-wrap">
  <div class="onboard-head">
    <span class="eyebrow">✨ GlowGuide</span>
    <h1 style="font-size:1.9rem;margin-top:.3em">Start your glow journey</h1>
    <p>Create an account to save your routines, products and plans.</p>
  </div>

  <div class="card">
    <form id="registerForm" novalidate>
      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Your name" autocomplete="name" required>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="text" id="email" placeholder="you@example.com" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="At least 8 characters" autocomplete="new-password" required>
      </div>
      <div class="field" style="margin-bottom:8px">
        <label for="confirmPassword">Confirm password</label>
        <input type="password" id="confirmPassword" placeholder="Re-enter your password" autocomplete="new-password" required>
      </div>
      <div class="field-error" id="formError"></div>
      <button type="submit" class="btn btn-primary btn-block" id="submitBtn" style="margin-top:10px">Create Account ✨</button>
    </form>
  </div>

  <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
</div>

<script src="js/storage.js"></script>
<script src="js/app.js"></script>
<script src="js/api.js"></script>
<script>
(function () {
  const form = document.getElementById('registerForm');
  const errorBox = document.getElementById('formError');
  const submitBtn = document.getElementById('submitBtn');

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.classList.add('show');
  }
  function clearError() {
    errorBox.classList.remove('show');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearError();

    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    if (!name || !email || !password) { showError('Please fill in every field.'); return; }
    if (password.length < 8) { showError('Password must be at least 8 characters.'); return; }
    if (password !== confirmPassword) { showError('Passwords do not match.'); return; }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Creating your account…';

    const result = await GG.api.post('/auth/register', { name, email, password, confirmPassword });

    if (!result.ok) {
      showError(result.message || 'Could not create your account. Please try again.');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Create Account ✨';
      return;
    }

    GG.toast('✨ Welcome to GlowGuide!');
    window.location.href = 'profile.html';
  });
})();
</script>
</body>
</html>
